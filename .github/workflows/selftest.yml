# Weekly: run the test suite, check that every live page answers and carries its sources, that the
# market prices on the live site are fresh, and that each source was read successfully recently.
# A failure here emails the repository owner; it never changes the live site.
name: Weekly self-test

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and build tests
        run: python3 -m unittest discover -s tests -v
      - name: Every source read successfully in time
        run: python3 -m tracker.refresh --check-fresh
      - name: Live site, links and freshness
        run: python3 -m tracker.selftest --site-url "$SITE_URL"
      - name: Keep the schedules alive (GitHub pauses them after 60 days without a commit)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git commit -q --allow-empty -m "keep-alive: no data changed in 45 days"
            git push -q origin HEAD:main || echo "::warning::keep-alive push failed"
          fi
          for wf in update.yml selftest.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" >/dev/null || echo "::warning::could not re-enable $wf"
          done
