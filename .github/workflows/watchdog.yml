# Watchdog: GitHub drops scheduled runs under load. Twice an hour, on different minutes than the
# update job, check how old the live market prices are; if older than 70 minutes and no update is
# already queued or running, start "Update and deploy". Read-only otherwise; never touches the site.
name: Watchdog

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start an update if the live prices are stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          age=$(python3 -m tracker.watchdog --site-url "$SITE_URL")
          echo "Live market prices are ${age} minutes old."
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$age" -gt 70 ] && [ "$busy" = "0" ]; then
            gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "::warning::Prices were ${age} minutes old; started Update and deploy."
          fi
      - name: Keep the schedules alive (GitHub pauses them after 60 days without a commit)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git commit -q --allow-empty -m "keep-alive: no data changed in 45 days"
            git push -q origin HEAD:main || echo "::warning::keep-alive push failed"
          fi
          for wf in update.yml selftest.yml watchdog.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" >/dev/null || echo "::warning::could not re-enable $wf"
          done
